<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#E16638;
    --soft-orange:#FF9972;
    --sage:#95AD7C;
    --black:#15130F;
    --white:#FFFFFF;
    --tint-orange:#FFF3EC;
    --tint-sage:#F3F6EF;
    --border:#E7E2DC;
    --serif:'Playfair Display',serif;
    --sans:'DM Sans',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--sans);color:var(--black);background:linear-gradient(160deg,var(--white) 0%,var(--tint-orange) 100%);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%;}

  header{padding:20px 0;}
  header .wrap{display:flex;align-items:center;}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .notfound{padding:48px 0 64px;text-align:center;}
  .notfound .wrap{max-width:640px;}

  .code{font-family:var(--serif);font-weight:900;font-size:clamp(72px,14vw,140px);line-height:1;color:var(--orange);letter-spacing:-0.02em;}
  .code em{font-style:normal;color:var(--sage);}
  h1{font-family:var(--serif);font-weight:800;font-size:clamp(24px,3.5vw,34px);margin:8px 0 14px;letter-spacing:-0.01em;}
  .lede{font-size:17px;color:#5d584e;max-width:460px;margin:0 auto 36px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-weight:700;font-size:15px;padding:14px 28px;border-radius:8px;border:2px solid var(--black);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;white-space:nowrap;text-decoration:none;}
  .btn-primary{background:var(--orange);border-color:var(--orange);color:var(--white);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 0 0 #00000022;}
  .btn-outline{background:transparent;color:var(--black);}
  .btn-outline:hover{background:var(--black);color:var(--white);}
  .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:44px;}

  .links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;padding-top:28px;border-top:1px solid var(--border);}
  .links a{font-size:14px;font-weight:600;color:#3f3b35;transition:color .15s;}
  .links a:hover{color:var(--orange);}

  footer{padding:24px 0;text-align:center;}
  footer .copy{font-size:13px;color:#8c8578;}

  @media(max-width:480px){
    .actions{flex-direction:column;align-items:stretch;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="/">
      <img src="logo.png" alt="thedamlek digital" style="height:56px;width:auto;display:block;">
    </a>
  </div>
</header>

<main>
  <section class="notfound">
    <div class="wrap">
      <div class="code">4<em>0</em>4</div>
      <h1>Looks like this page leaked out of the funnel.</h1>
      <p class="lede">The page you're looking for doesn't exist, moved, or never made it live. Let's get you back on track.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Back to Homepage</a>
        <a href="/blog" class="btn btn-outline">Visit the Blog</a>
      </div>
      <div class="links">
        <a href="/#services">Services</a>
        <a href="/portfolio">Portfolio</a>

        <a href="/#contact">Contact Us</a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="copy">&copy; 2026 thedamlek digital. All rights reserved.</span>
  </div>
</footer>

</body>
</html>
