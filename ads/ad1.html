<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;0,900;1,800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #15130F; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .ad { width: 1080px; height: 1080px; padding: 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo img { height: 56px; width: auto; filter: brightness(0) invert(1); }
  .mid {}
  .tag { display: inline-block; background: #E16638; color: #fff; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; padding: 10px 24px; border-radius: 6px; margin-bottom: 36px; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 86px; color: #fff; line-height: 1.06; letter-spacing: -0.02em; margin-bottom: 36px; }
  h1 em { font-style: normal; color: #E16638; }
  .dots { display: flex; gap: 12px; margin-bottom: 36px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #E16638; opacity: 0.25; }
  .dot.on { opacity: 1; }
  .body { font-size: 28px; color: #6b6560; line-height: 1.55; max-width: 820px; }
  .cta { display: inline-block; background: #E16638; color: #fff; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 28px; padding: 26px 52px; border-radius: 10px; letter-spacing: 0.01em; }
</style>
</head>
<body>
<div class="ad">
  <div class="logo"><img src="../logo.png" alt="thedamlek digital"></div>
  <div class="mid">
    <div class="tag">Free Audit — Limited Slots</div>
    <h1>Your business may be <em>leaking leads</em> every single day.</h1>
    <div class="dots">
      <div class="dot on"></div><div class="dot on"></div><div class="dot on"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <p class="body">We review your website, offer, ads &amp; tracking — and show you exactly where to fix it. Free. In 48 hours. No obligation.</p>
  </div>
  <div>
    <div class="cta">Get Your Free Growth Leak Audit &rarr;</div>
  </div>
</div>
</body>
</html>
