<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #E16638; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .ad { width: 1080px; height: 1080px; padding: 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo img { height: 56px; width: auto; filter: brightness(0) invert(1); }
  h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 80px; color: #fff; line-height: 1.08; letter-spacing: -0.02em; margin: 48px 0 52px; }
  .problems { display: flex; flex-direction: column; gap: 24px; margin-bottom: 64px; }
  .prob { display: flex; align-items: flex-start; gap: 22px; }
  .prob-icon { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 4px; }
  .prob-icon svg { width: 20px; height: 20px; }
  .prob p { font-size: 30px; color: #fff; font-weight: 500; line-height: 1.35; }
  .bottom { display: flex; align-items: center; gap: 32px; }
  .cta { display: inline-block; background: #15130F; color: #fff; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 28px; padding: 26px 52px; border-radius: 10px; }
  .note { font-size: 22px; color: rgba(255,255,255,0.65); font-weight: 600; }
</style>
</head>
<body>
<div class="ad">
  <div class="logo"><img src="../logo.png" alt="thedamlek digital"></div>
  <div>
    <h1>Running ads and still not getting leads?</h1>
    <div class="problems">
      <div class="prob">
        <div class="prob-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        <p>Your offer isn't clear enough to convert visitors</p>
      </div>
      <div class="prob">
        <div class="prob-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        <p>Your landing page is losing people before they act</p>
      </div>
      <div class="prob">
        <div class="prob-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        <p>Your tracking isn't showing what actually works</p>
      </div>
    </div>
  </div>
  <div class="bottom">
    <div class="cta">Fix It Free — 48 Hours &rarr;</div>
    <span class="note">No pressure. No obligation.</span>
  </div>
</div>
</body>
</html>
