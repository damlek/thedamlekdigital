<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #fff; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .ad { width: 1080px; height: 1080px; padding: 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo img { height: 56px; width: auto; }
  .free { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 160px; color: #E16638; line-height: 0.9; letter-spacing: -0.04em; margin-bottom: 8px; }
  .audit-name { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 46px; color: #15130F; line-height: 1.15; letter-spacing: -0.01em; margin-bottom: 48px; }
  .divider { width: 64px; height: 3px; background: #E7E2DC; margin-bottom: 48px; }
  .stats { display: flex; gap: 0; margin-bottom: 52px; }
  .stat { flex: 1; padding-right: 40px; border-right: 1.5px solid #E7E2DC; margin-right: 40px; }
  .stat:last-child { border-right: none; margin-right: 0; padding-right: 0; }
  .stat-num { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 52px; color: #15130F; line-height: 1; margin-bottom: 8px; }
  .stat-label { font-size: 20px; color: #9a948a; font-weight: 500; line-height: 1.3; }
  .strikethrough { font-size: 22px; color: #c0bab4; text-decoration: line-through; font-weight: 500; margin-bottom: 20px; }
  .cta { display: block; background: #15130F; color: #fff; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 28px; padding: 26px 52px; border-radius: 10px; text-align: center; }
</style>
</head>
<body>
<div class="ad">
  <div class="logo"><img src="../logo.png" alt="thedamlek digital"></div>
  <div>
    <div class="free">Free.</div>
    <div class="audit-name">Growth Leak Audit&trade;<br>for your business</div>
    <div class="divider"></div>
    <div class="stats">
      <div class="stat">
        <div class="stat-num">48hrs</div>
        <div class="stat-label">Turnaround time</div>
      </div>
      <div class="stat">
        <div class="stat-num">3–5</div>
        <div class="stat-label">Specific growth leaks identified</div>
      </div>
      <div class="stat">
        <div class="stat-num">$0</div>
        <div class="stat-label">Your cost, no obligation</div>
      </div>
    </div>
    <div class="strikethrough">Valued at $1,750</div>
  </div>
  <div class="cta">Claim Your Free Audit &rarr;</div>
</div>
</body>
</html>
