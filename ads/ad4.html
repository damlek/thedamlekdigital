<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;0,900;1,800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #F3F6EF; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .ad { width: 1080px; height: 1080px; padding: 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo img { height: 56px; width: auto; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 76px; color: #15130F; line-height: 1.08; letter-spacing: -0.02em; margin: 48px 0 52px; }
  h1 em { font-style: normal; color: #E16638; }
  .services { display: flex; flex-direction: column; gap: 22px; margin-bottom: 64px; }
  .svc { display: flex; align-items: center; gap: 22px; }
  .svc-dot { width: 14px; height: 14px; border-radius: 50%; background: #95AD7C; flex-shrink: 0; }
  .svc p { font-size: 30px; color: #3f3b35; font-weight: 600; }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .cta { display: inline-block; background: #E16638; color: #fff; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 28px; padding: 26px 52px; border-radius: 10px; }
  .tagline { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 22px; color: #95AD7C; font-style: italic; text-align: right; max-width: 260px; line-height: 1.3; }
</style>
</head>
<body>
<div class="ad">
  <div class="logo"><img src="../logo.png" alt="thedamlek digital"></div>
  <div>
    <h1>We don't just run ads. We build a <em>full growth system.</em></h1>
    <div class="services">
      <div class="svc"><div class="svc-dot"></div><p>Paid Media — Meta &amp; Google Ads</p></div>
      <div class="svc"><div class="svc-dot"></div><p>Landing Page &amp; Offer Optimisation</p></div>
      <div class="svc"><div class="svc-dot"></div><p>Messaging &amp; Conversion Strategy</p></div>
      <div class="svc"><div class="svc-dot"></div><p>Tracking, Analytics &amp; Email Marketing</p></div>
    </div>
  </div>
  <div class="bottom">
    <div class="cta">Start with a Free Audit &rarr;</div>
    <div class="tagline">Not just ads.<br>Not just traffic.</div>
  </div>
</div>
</body>
</html>
