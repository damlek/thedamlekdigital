<html lang="en">
<head>

<title>Blog | thedamlek digital</title>
<meta name="description" content="Growth marketing tips, strategy, and lessons from thedamlek digital — helping small businesses attract, convert, and retain more customers.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#E16638; --soft-orange:#FF9972; --sage:#95AD7C;
    --black:#15130F; --white:#FFFFFF; --tint-orange:#FFF3EC; --tint-sage:#F3F6EF;
    --border:#E7E2DC; --serif:'Playfair Display', serif; --sans:'DM Sans', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--sans);color:var(--black);background:var(--white);line-height:1.6;-webkit-font-smoothing:antialiased;}
  img{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  h1,h2,h3{font-family:var(--serif);font-weight:800;line-height:1.15;letter-spacing:-0.01em;}
  .eyebrow{font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--orange);margin-bottom:14px;}

  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  header .wrap{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:700;font-size:14px;padding:11px 20px;border-radius:8px;border:2px solid var(--black);cursor:pointer;}
  .btn:hover{background:var(--black);color:var(--white);}
  nav{display:flex;align-items:center;gap:20px;}
  nav a{font-size:14px;font-weight:600;color:#3f3b35;}
  nav a:hover{color:var(--orange);}

  .page-hero{padding:64px 0 40px;text-align:center;background:linear-gradient(160deg,var(--white) 0%,var(--tint-orange) 100%);}
  .page-hero h1{font-size:clamp(32px,5vw,50px);margin-bottom:14px;}
  .page-hero p{font-size:17px;color:#4a463f;max-width:560px;margin:0 auto;}

  main{padding:56px 0 88px;}
  .post-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .post-card{border:1.5px solid var(--border);border-radius:16px;overflow:hidden;background:var(--white);transition:transform .2s ease,box-shadow .2s ease;display:flex;flex-direction:column;}
  .post-card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.08);}
  .post-card .pc-cover{width:100%;height:170px;object-fit:cover;background:var(--tint-sage);}
  .post-card .pc-body{padding:20px 20px 22px;flex:1;display:flex;flex-direction:column;}
  .post-card .pc-date{font-size:12px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
  .post-card h3{font-size:19px;margin-bottom:8px;}
  .post-card p{font-size:14.5px;color:#5d584e;flex:1;}
  .post-card .pc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .post-card .pc-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--tint-sage);color:#3A6830;}

  .state-msg{text-align:center;padding:60px 20px;color:#9a948a;font-size:15px;grid-column:1/-1;}

  footer{background:var(--black);color:#cfcabf;padding:40px 0 24px;margin-top:40px;}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
  footer .copy{font-size:13px;color:#8c8578;}

  @media (max-width:900px){ .post-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:600px){ .post-grid{grid-template-columns:1fr;} nav{gap:12px;} header .wrap{padding:12px 16px;} }
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MX5G8NK5"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header>
  <div class="wrap">
    <a href="/"><img src="logo.png" alt="thedamlek digital" style="height:52px;width:auto;"></a>
    <nav>
      <a href="/blog">Blog</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/tools/roas-calculator">Free Tools</a>
      <a href="/" class="btn">Back to Site</a>
    </nav>
  </div>
</header>

<div class="page-hero">
  <div class="wrap">
    <div class="eyebrow" style="justify-content:center;display:flex;">// The Blog</div>
    <h1>Growth Marketing, Explained Simply.</h1>
    <p>Practical tips and lessons on offers, ads, tracking, and turning more visitors into customers.</p>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="post-grid" id="post-grid">
      <div class="state-msg">Loading posts…</div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <img src="logo.png" alt="thedamlek digital" style="height:44px;width:auto;filter:brightness(0) invert(1);">
    <span class="copy">&copy; 2026 thedamlek digital. All rights reserved.</span>
  </div>
</footer>

<script>
  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  fetch('/api/blog')
    .then(function (res) { return res.json(); })
    .then(function (posts) {
      var grid = document.getElementById('post-grid');
      if (!Array.isArray(posts) || !posts.length) {
        grid.innerHTML = '<div class="state-msg">No posts published yet. Check back soon.</div>';
        return;
      }
      grid.innerHTML = posts.map(function (p) {
        var date = new Date(p.published_at || p.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        var tags = Array.isArray(p.tags) ? p.tags : [];
        return '<a class="post-card" href="/blog/' + encodeURIComponent(p.slug) + '">' +
          (p.cover_image_url ? '<img class="pc-cover" src="' + esc(p.cover_image_url) + '" alt="' + esc(p.title) + '">' : '<div class="pc-cover"></div>') +
          '<div class="pc-body">' +
            '<div class="pc-date">' + date + '</div>' +
            '<h3>' + esc(p.title) + '</h3>' +
            '<p>' + esc(p.excerpt || '') + '</p>' +
            (tags.length ? '<div class="pc-tags">' + tags.map(function (t) { return '<span class="pc-tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
          '</div>' +
        '</a>';
      }).join('');
    })
    .catch(function () {
      document.getElementById('post-grid').innerHTML = '<div class="state-msg">Failed to load posts.</div>';
    });
</script>
</body>
</html>
